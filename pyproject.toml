[project]
name = "robothector"
version = "0.1.0"
description = "Remote-controlled robot with video streaming"
requires-python = ">=3.11"

[project.optional-dependencies]
server = [
    "flask>=2.2",
    "websockets>=12.0",
    "picamera2>=0.3; platform_machine=='aarch64'",
    "RPi.GPIO>=0.7; platform_machine=='aarch64'",
    "pygame>=2.1",
    "sounddevice>=0.4",
    "numpy>=1.24",
]
client = [
    "pygame>=2.1",
    "websocket-client>=1.6",
    "sounddevice>=0.4",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
